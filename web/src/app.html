<!doctype html>
<html lang="en-PH" data-theme="dark">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/favicon.ico" sizes="any" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<!-- Blocking Script to Prevent Dark/Light Mode Flash -->
	<script>
		const savedTheme = localStorage.getItem('theme');
		if (savedTheme) {
			document.documentElement.setAttribute('data-theme', savedTheme);
		} else {
			document.documentElement.setAttribute('data-theme', 'dark');
		}
	</script>

	<!-- Google Fonts: Syne, Epilogue & Caveat -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Epilogue:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Syne:wght@600..800&display=swap"
		rel="stylesheet" />

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
